<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" role="img" aria-labelledby="title desc">
  <title id="title">Terminal do UnBreakable</title>
  <desc id="desc">Comandos animados apresentam o grupo de estudos UnBreakable e revelam um lobo em ASCII.</desc>
  <style>
    .terminal { fill: #080510; stroke: #562197; stroke-width: 2; }
    .bar { fill: #171027; }
    .text { font: 18px 'IBM Plex Mono', 'DejaVu Sans Mono', monospace; dominant-baseline: hanging; }
    .prompt { fill: #71d66d; }
    .command, .output { fill: #f7f3ff; }
    .muted { fill: #c8bed9; }
    .ascii { fill: #262334; font: 8px 'IBM Plex Mono', 'DejaVu Sans Mono', monospace; dominant-baseline: hanging; }
    .ascii-purple { fill: #8437d9; }
    .ascii-pink { fill: #bd66d8; }
    .ascii-green { fill: #46ef0f; }
    .line { clip-path: inset(0 100% 0 0); }
    .l1 { animation: type1 12s linear infinite; }
    .l2 { animation: type2 12s linear infinite; }
    @keyframes type1 { 0%, 4% { clip-path: inset(0 100% 0 0); } 16%, 100% { clip-path: inset(0 0 0 0); } }
    @keyframes type2 { 0%, 21% { clip-path: inset(0 100% 0 0); } 88%, 100% { clip-path: inset(0 0 0 0); } }
  </style>
  <rect class="terminal" x="1" y="1" width="778" height="448" rx="16" />
